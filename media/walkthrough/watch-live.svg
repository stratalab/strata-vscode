<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="arrive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--vscode-charts-green, #57ab5a)" stop-opacity="0.18" />
      <stop offset="1" stop-color="var(--vscode-charts-green, #57ab5a)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- the event feed -->
  <rect x="90" y="70" width="620" height="330" rx="6" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-panel-border, #3a424c)" />

  <!-- scope banner: crumbs left, activity + live dot right -->
  <text x="114" y="103" font-size="13.5" fill="var(--vscode-descriptionForeground, #8b93a1)">agent-memory <tspan dx="2">▸</tspan> <tspan dx="2" letter-spacing="1.2" font-size="12.5" fill="var(--vscode-foreground, #c6ccd2)">MAIN</tspan> <tspan dx="2">▸</tspan> <tspan dx="2" letter-spacing="1.2" font-size="12.5" fill="var(--vscode-foreground, #c6ccd2)">DEFAULT</tspan></text>
  <g fill="var(--vscode-descriptionForeground, #8b93a1)" opacity="0.9">
    <rect x="596" y="96" width="3" height="4" />
    <rect x="601" y="93" width="3" height="7" />
    <rect x="606" y="88" width="3" height="12" />
    <rect x="611" y="84" width="3" height="16" />
  </g>
  <circle cx="634" cy="94" r="4.5" fill="var(--vscode-charts-green, #57ab5a)" />
  <text x="646" y="99" font-size="13.5" fill="var(--vscode-foreground, #c6ccd2)">Live</text>
  <line x1="90" y1="116" x2="710" y2="116" stroke="var(--vscode-panel-border, #3a424c)" />

  <!-- feed rows, newest at the bottom -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13">
    <g transform="translate(0,140)">
      <text x="116" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">#182</text>
      <rect x="168" y="-11" width="86" height="22" rx="11" fill="none" stroke="var(--vscode-charts-blue, #4d8edb)" opacity="0.75" />
      <text x="211" y="5" text-anchor="middle" font-size="12" fill="var(--vscode-charts-blue, #4d8edb)">agent.step</text>
      <text x="272" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">plan: summarize yesterday's session</text>
    </g>
    <g transform="translate(0,182)">
      <text x="116" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">#183</text>
      <rect x="168" y="-11" width="86" height="22" rx="11" fill="none" stroke="var(--vscode-charts-orange, #d19a2f)" opacity="0.75" />
      <text x="211" y="5" text-anchor="middle" font-size="12" fill="var(--vscode-charts-orange, #d19a2f)">tool.call</text>
      <text x="272" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">kv.scan prefix="note:" limit=40</text>
    </g>
    <g transform="translate(0,224)">
      <text x="116" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">#184</text>
      <rect x="168" y="-11" width="106" height="22" rx="11" fill="none" stroke="var(--vscode-charts-green, #57ab5a)" opacity="0.75" />
      <text x="221" y="5" text-anchor="middle" font-size="12" fill="var(--vscode-charts-green, #57ab5a)">memory.write</text>
      <text x="292" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">note:standup-summary · 412 B</text>
    </g>
    <g transform="translate(0,266)">
      <text x="116" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">#185</text>
      <rect x="168" y="-11" width="86" height="22" rx="11" fill="none" stroke="var(--vscode-charts-blue, #4d8edb)" opacity="0.75" />
      <text x="211" y="5" text-anchor="middle" font-size="12" fill="var(--vscode-charts-blue, #4d8edb)">agent.step</text>
      <text x="272" y="5" fill="var(--vscode-descriptionForeground, #8b93a1)">reflect: 3 items promoted to memory</text>
    </g>
    <!-- the arrival: green edge and a fade that is already receding -->
    <g transform="translate(0,308)">
      <rect x="91" y="-16" width="618" height="32" fill="url(#arrive)" />
      <rect x="91" y="-16" width="3" height="32" fill="var(--vscode-charts-green, #57ab5a)" />
      <text x="116" y="5" fill="var(--vscode-foreground, #c6ccd2)">#186</text>
      <rect x="168" y="-11" width="106" height="22" rx="11" fill="none" stroke="var(--vscode-charts-green, #57ab5a)" />
      <text x="221" y="5" text-anchor="middle" font-size="12" fill="var(--vscode-charts-green, #57ab5a)">memory.write</text>
      <text x="292" y="5" fill="var(--vscode-foreground, #c6ccd2)">note:decision-log · chain verified</text>
    </g>
  </g>

  <!-- the follow pill: shown when the reader is upstream -->
  <g>
    <rect x="556" y="352" width="128" height="30" rx="15" fill="var(--vscode-button-background, #3b82d9)" />
    <text x="620" y="372" font-size="13" text-anchor="middle" fill="var(--vscode-button-foreground, #ffffff)">1 new event ↓</text>
  </g>
</svg>
