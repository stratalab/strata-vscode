<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <g id="strata" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6.5h18" />
      <path d="M3 6.5c0-1.7 4-3 9-3s9 1.3 9 3" />
      <path d="M3 6.5v4c0 1.7 4 3 9 3s9-1.3 9-3v-4" />
      <path d="M3 12.5v4c0 1.7 4 3 9 3s9-1.3 9-3v-4" />
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10" fill="none" stroke="var(--vscode-descriptionForeground, #8b93a1)" stroke-width="1.6" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- the unowned database row -->
  <rect x="70" y="82" width="300" height="48" rx="6" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-panel-border, #3a424c)" />
  <use href="#strata" transform="translate(88,94)" stroke="var(--vscode-descriptionForeground, #8b93a1)" />
  <text x="122" y="111" font-size="15" fill="var(--vscode-foreground, #c6ccd2)">scratch-db</text>
  <circle cx="222" cy="106" r="4.5" fill="none" stroke="var(--vscode-descriptionForeground, #8b93a1)" stroke-width="1.4" />
  <text x="236" y="111" font-size="13" fill="var(--vscode-descriptionForeground, #8b93a1)">unowned</text>

  <!-- context menu -->
  <rect x="118" y="150" width="240" height="118" rx="6" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-panel-border, #3a424c)" />
  <rect x="124" y="158" width="228" height="32" rx="4" fill="var(--vscode-charts-blue, #4d8edb)" opacity="0.16" />
  <text x="138" y="179" font-size="14" fill="var(--vscode-foreground, #c6ccd2)">Start Database Host</text>
  <text x="138" y="215" font-size="14" fill="var(--vscode-descriptionForeground, #8b93a1)">Run Doctor</text>
  <line x1="126" y1="228" x2="350" y2="228" stroke="var(--vscode-panel-border, #3a424c)" />
  <text x="138" y="252" font-size="14" fill="var(--vscode-descriptionForeground, #8b93a1)">Time Travel…</text>

  <!-- menu → socket -->
  <path d="M362 209C420 209 430 240 464 252" fill="none" stroke="var(--vscode-descriptionForeground, #8b93a1)" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- the socket hub the host opens -->
  <circle cx="520" cy="268" r="42" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-charts-green, #57ab5a)" stroke-width="1.8" />
  <use href="#strata" transform="translate(504,252) scale(1.35)" stroke="var(--vscode-foreground, #c6ccd2)" />
  <text x="520" y="336" font-size="12.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" fill="var(--vscode-descriptionForeground, #8b93a1)">strata start</text>
  <text x="520" y="354" font-size="12.5" text-anchor="middle" fill="var(--vscode-descriptionForeground, #8b93a1)">one owner, one socket</text>

  <!-- everyone attaches -->
  <g font-size="13.5">
    <rect x="628" y="120" width="132" height="36" rx="18" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-panel-border, #3a424c)" />
    <circle cx="648" cy="138" r="4" fill="var(--vscode-charts-green, #57ab5a)" />
    <text x="660" y="143" fill="var(--vscode-foreground, #c6ccd2)">your app</text>

    <rect x="628" y="196" width="132" height="36" rx="18" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-panel-border, #3a424c)" />
    <circle cx="648" cy="214" r="4" fill="var(--vscode-charts-blue, #4d8edb)" />
    <text x="660" y="219" fill="var(--vscode-foreground, #c6ccd2)">strata repl</text>

    <rect x="628" y="272" width="150" height="36" rx="18" fill="var(--vscode-editor-background, #1e242b)" stroke="var(--vscode-panel-border, #3a424c)" />
    <circle cx="648" cy="290" r="4" fill="var(--vscode-foreground, #c6ccd2)" />
    <text x="660" y="295" fill="var(--vscode-foreground, #c6ccd2)">this window</text>
  </g>
  <g fill="none" stroke="var(--vscode-descriptionForeground, #8b93a1)" stroke-width="1.4">
    <path d="M628 142C580 150 566 200 556 232" marker-end="url(#arrow)" />
    <path d="M628 216C600 220 580 234 566 246" marker-end="url(#arrow)" />
    <path d="M628 288C600 286 580 280 563 275" marker-end="url(#arrow)" />
  </g>
  <text x="700" y="322" font-size="12" text-anchor="middle" fill="var(--vscode-descriptionForeground, #8b93a1)">read-only session</text>
</svg>
