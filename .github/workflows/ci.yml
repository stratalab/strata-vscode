name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the coverage guard can diff the ledger against main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Regeneration no-diff guard (AR-1.3)
        run: npm run generate -- --check

      - name: Coverage guard (AR-1.3)
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            npm run guard -- --base origin/main
          else
            npm run guard
          fi

      - run: npm run build

      - name: E2E activation smoke
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: pin
        run: echo "rev=$(cat idl/v1/STRATA_CORE_REV)" >> "$GITHUB_OUTPUT"

      - name: Cache the strata binary by pin
        id: bincache
        uses: actions/cache@v4
        with:
          path: .strata-bin
          key: strata-bin-${{ runner.os }}-${{ steps.pin.outputs.rev }}

      # strata-core is public, but its hub crate git-pins the PRIVATE
      # stratalab/stratahub repo (non-optional deps), so building the binary
      # needs a read token for that repo. Without the secret, this tier skips
      # loudly rather than failing — configure it with:
      #   gh secret set STRATAHUB_TOKEN   # fine-grained PAT: read on stratalab/stratahub
      - name: Build strata from the pinned rev (N9)
        if: steps.bincache.outputs.cache-hit != 'true'
        env:
          STRATAHUB_TOKEN: ${{ secrets.STRATAHUB_TOKEN }}
        run: |
          if [ -z "$STRATAHUB_TOKEN" ]; then
            echo "::notice title=Integration tier skipped::STRATAHUB_TOKEN is not configured; strata cannot be built (strata-core depends on the private stratalab/stratahub repo). The cross-process suite ran locally; add the secret to run it in CI."
            exit 0
          fi
          git config --global url."https://x-access-token:${STRATAHUB_TOKEN}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          git clone --filter=blob:none https://github.com/stratalab/strata-core.git /tmp/strata-core
          git -C /tmp/strata-core checkout ${{ steps.pin.outputs.rev }}
          cargo build --manifest-path /tmp/strata-core/Cargo.toml -p strata-cli --bin strata --release
          mkdir -p .strata-bin
          cp /tmp/strata-core/target/release/strata .strata-bin/strata

      - id: havebin
        run: echo "present=$([ -x .strata-bin/strata ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.havebin.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - if: steps.havebin.outputs.present == 'true'
        run: npm ci

      - name: Cross-process wire scenarios (N7)
        if: steps.havebin.outputs.present == 'true'
        run: STRATA_BIN="$PWD/.strata-bin/strata" npm run test:integration
