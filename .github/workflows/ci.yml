name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the coverage guard can diff the ledger against main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Regeneration no-diff guard (AR-1.3)
        run: npm run generate -- --check

      - name: Coverage guard (AR-1.3)
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            npm run guard -- --base origin/main
          else
            npm run guard
          fi

      - run: npm run build

      - name: E2E activation smoke
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi
